openapi: 3.0.4
info:
  title: Moon Phases
  description: >-
    Moon Phases calculates the current lunar phase, illumination percentage, and
    lunar age for today. It reports waxing or waning status, Earth-moon distance
    in Earth radii and kilometers, the next principal phase and emoji
    representations, while paid plans add custom date queries and the dates of
    the next new moon, first quarter, full moon and last quarter.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/moonphases:
    get:
      summary: Moon Phases
      description: Get the moon phase for today
      operationId: moonphases
      parameters:
        - name: today
          in: query
          schema:
            type: boolean
          required: false
          description: Get the moon phase for today
          example: true
        - name: phases
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Include the dates of the next new moon, first quarter and last
            quarter and the days to each
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  date: '2026-10-27'
                  phase: Full
                  phaseEmoji: 🌕
                  illumination: 98.8
                  waxing: false
                  waning: true
                  lunarAge: 15.775469393347242
                  lunarAgePercent: 0.534207769602574
                  lunationNumber: 1285
                  lunarDistance: 57.48396905317442
                  nextFullMoon: '2026-11-24T17:29:23.611Z'
                  lastFullMoon: '2026-10-26T04:45:20.833Z'
                  daysToFullMoon: 29
                  daysSinceFullMoon: 1
                  lunarDistanceKm: 366230
                  nextPhase: Last Quarter
                  nextPhaseDate: '2026-11-02T13:56:21.527Z'
                  daysToNextPhase: 6
                  nextNewMoon: '2026-11-09T23:07:22.222Z'
                  lastNewMoon: '2026-10-11T10:23:19.444Z'
                  daysToNewMoon: 14
                  daysSinceNewMoon: 16
                  nextFirstQuarter: '2026-11-17T08:18:22.916Z'
                  nextLastQuarter: '2026-11-02T13:56:21.527Z'
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
